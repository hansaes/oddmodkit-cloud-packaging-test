name: OddModKit Windows package smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oddmodkit-windows-package-smoke
  cancel-in-progress: false

jobs:
  package:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out build scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch licensed UE 5.5.1 source
        env:
          UE_SOURCE_ARCHIVE_URL: ${{ secrets.UE551_SOURCE_ARCHIVE_URL }}
        run: ./scripts/Invoke-CloudPackageSmoke.ps1 -Phase Fetch

      - name: Check out official ModKit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MassiveMiniteam/OddModKit
          ref: b7ac82de0b64ef3eff744b7c4d6ca22c95d12757
          path: sdk
          persist-credentials: false

      - name: Download Win64 dependencies and select compiler
        run: ./scripts/Invoke-CloudPackageSmoke.ps1 -Phase Dependencies

      - name: Compile packaging tools
        run: ./scripts/Invoke-CloudPackageSmoke.ps1 -Phase Tools

      - name: Compile official ModKit editor
        run: ./scripts/Invoke-CloudPackageSmoke.ps1 -Phase Editor

      - name: Cook and package official Windows sample
        run: ./scripts/Invoke-CloudPackageSmoke.ps1 -Phase Package

      - name: Verify and export only RecipeSwitcher chunk
        run: ./scripts/Invoke-CloudPackageSmoke.ps1 -Phase Verify

      - name: Save build report without engine source or raw logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-smoke-report
          path: package-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Save verified native mod package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RecipeSwitcher-package-smoke
          path: dist/RecipeSwitcher/
          if-no-files-found: error
          retention-days: 1
